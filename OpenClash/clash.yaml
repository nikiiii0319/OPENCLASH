# ==================== 分流规则 Rules ====================
# 规则从上到下匹配，匹配到第一条后停止。格式：类型,匹配内容,策略组[,no-resolve]
# GEOSITE=域名分类,GEOIP=IP归属,RULE-SET=外部规则集,MATCH=兜底规则
# no-resolve=不进行DNS解析直接匹配IP（提高性能，避免DNS泄露）
rules:
  - GEOSITE,private,🎯 全球直连
  - GEOIP,private,🎯 全球直连,no-resolve
  - RULE-SET,Custom_Direct,🎯 全球直连
  - RULE-SET,Custom_Direct_Domain,🎯 全球直连
  - RULE-SET,Custom_Direct_IP,🎯 全球直连,no-resolve
  - RULE-SET,Custom_Direct_Port,🎯 全球直连
  - RULE-SET,Custom_Proxy_Domain,♻️ 手动切换
  - RULE-SET,Custom_Proxy_IP,♻️ 手动切换,no-resolve
  - GEOSITE,google-cn,🎯 全球直连
  - GEOSITE,category-games@cn,🎯 全球直连
  - RULE-SET,Steam_CDN_Domain,🎯 全球直连
  - RULE-SET,Steam_CDN_IP,🎯 全球直连,no-resolve
  - GEOSITE,category-game-platforms-download,🎯 全球直连
  - GEOSITE,category-public-tracker,🎯 全球直连
  - GEOSITE,category-communication,📲 聊天软件
  - GEOSITE,category-social-media-!cn,📲 聊天软件
  - GEOSITE,openai,💬 AI服务
  - GEOSITE,category-ai-!cn,💬 AI服务
  - GEOSITE,github,🚀 GitHub
  - GEOSITE,category-speedtest,🗺 Speedtest
  - GEOSITE,steam,🎮 游戏平台
  - GEOSITE,youtube,📹 YouTube
  - GEOSITE,apple-tvplus,🎥 AppleTV+
  - GEOSITE,apple,🍎 苹果服务
  - GEOSITE,microsoft,Ⓜ️ 微软服务
  - GEOSITE,googlefcm,📢 谷歌FCM
  - GEOSITE,google,🔎 Google
  - GEOSITE,category-emby,🎥 EMBY
  - RULE-SET,Emby,🎥 EMBY
  - GEOSITE,tiktok,🎥 TikToK
  - GEOSITE,netflix,🎥 Netflix
  - GEOSITE,discord,📲 Discord
  - GEOSITE,disney,🎥 DisneyPlus
  - GEOSITE,hbo,🎥 HBO
  - GEOSITE,primevideo,🎥 PrimeVideo
  - GEOSITE,spotify,🎻 Spotify
  - GEOSITE,bahamut,📺 Bahamut
