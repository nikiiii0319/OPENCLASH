    behavior: ipcidr  # Steam CDN下载服务器（直连获得更快速度）
    interval: 1800  # 半小时
    type: http
    url: "https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Steam_CDN_IP.mrs"
    format: mrs  # 二进制格式

  Emby:
    behavior: classical  # 混合类型（包含多种规则
    interval: 1800  # 半小时
    type: http
    url: "https://raw.githubusercontent.com/nikiiii0319/OPENCLASH/refs/heads/main/Rule/Emby.yaml"
    format: yaml  # 文本